<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Coordinadores - Bancosol</title>
    <script src="gestion_coordinadores.js" defer></script>
    <link rel="stylesheet" href="../../../assets/css/style_gestion.css">
</head>

<body>
    <header class="main-header">
        <div class="logo-area">
            <img src="/src/assets/images/LOGO_BANCOSOL_FOOTER.png" alt="Bancosol Logo">
            <div>
                <h1>GESTIÓN DE COORDINADORES</h1>
            </div>
        </div>
    </header>

    <main class="dashboard">

        <!-- ── FILTROS ── -->
        <section class="filters">
            <div class="filter-group">
                <label>ENTIDAD</label>
                <select id="filtro-entidad">
                    <option value="Todas">Todas</option>
                </select>

                <label>ÁREA</label>
                <select id="filtro-area">
                    <option value="Todas">Todas</option>
                </select>
            </div>
        </section>

        <div class="content-layout">   
            <!-- ── TABLA ── -->
            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>COORDINADOR</th>
                            <th>ENTIDAD</th>
                            <th>ÁREA ASIGNADA</th>
                            <th>TELÉFONO</th>
                            <th>CORREO</th>
                            <th>TIENDAS</th>
                            <th>USUARIO</th>
                            <th>CONTRASEÑA</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </section>

            <!-- ── PANEL LATERAL ── -->
            <aside class="details-panel">
                <div class="panel-header" id="panel-titulo">COORDINADOR SELECCIONADO</div>

                <!-- Vista de detalle: visible por defecto -->
                <div id="vista-detalle">
                    <div class="detail-row"><span>ID:</span>        <strong id="det-id">---</strong></div>
                    <div class="detail-row"><span>ENTIDAD:</span>   <strong id="det-entidad">---</strong></div>
                    <div class="detail-row"><span>ÁREA:</span>      <strong id="det-area">---</strong></div>
                    <div class="detail-row"><span>TELÉFONO:</span>  <strong id="det-tlf">---</strong></div>
                    <div class="detail-row"><span>CORREO:</span>    <strong id="det-email">---</strong></div>
                    <div class="detail-row"><span>TIENDAS:</span>   <strong id="det-tiendas">---</strong></div>
                    <div class="detail-row"><span>USUARIO:</span>   <strong id="det-usuario">---</strong></div>
                </div>

                <!-- Vista de formulario: oculta hasta que se pulse Añadir o Modificar -->
                <div id="vista-formulario" class="hidden">
                    <div class="detail-row"><span>ID</span>        <input type="text" id="f-id"></div>
                    <div class="detail-row"><span>NOMBRE</span>    <input type="text" id="f-nombre"></div>
                    <div class="detail-row"><span>ENTIDAD</span>   <input type="text" id="f-entidad"></div>
                    <div class="detail-row"><span>ÁREA</span>      <input type="text" id="f-area"></div>
                    <div class="detail-row"><span>TELÉFONO</span>  <input type="text" id="f-tlf"></div>
                    <div class="detail-row"><span>CORREO</span>    <input type="text" id="f-email"></div>
                    <div class="detail-row"><span>TIENDAS</span>   <input type="number" id="f-tiendas"></div>
                    <div class="detail-row"><span>USUARIO</span>   <input type="text" id="f-usuario"></div>
                    <div class="detail-row"><span>PASSWORD</span>  <input type="password" id="f-pass"></div>

                    <div class="action-buttons">
                        <button id="btn-confirmar">Guardar</button>
                        <button id="btn-cancelar">Cancelar</button>
                    </div>
                </div>

                <!-- Botones de acción: solo visibles para admin -->
                <div class="action-buttons hidden" id="admin-menu">
                    <button id="btn-anadir">Añadir coordinador</button>
                    <button id="btn-modificar">Modificar coordinador</button>
                    <button id="btn-eliminar">Eliminar coordinador</button>
                </div>

                <!-- Botón volver al menú principal -->
                <div class="action-buttons mt-10">
                    <button id="btn-volver-menu" class="btn-volver-menu">Menú Principal</button>
                </div>
            </aside>
        </div>
    </main>
    <footer>
        <script src="../../../components/footer/footer_comun.js" defer></script>
    </footer>
</body>
</html>
