<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Campaña - Bancosol</title>
    <script src="gestionar_campanya.js" defer></script>
    <link rel="stylesheet" href="../../../assets/css/style_gestion.css">
    
</head>
<body class="page-campanya">
    <header class="main-header">
        <div class="logo-area">
            <img src="/src/assets/images/LOGO_BANCOSOL_FOOTER.png" alt="Bancosol Logo">
            <h1>GESTIÓN DE CAMPAÑAS</h1>
        </div>
    </header>

    <main class="management-container">
        <!-- Columna Izquierda: Campaña y Nota -->
        <div class="campanya-column">
            <div class="box campanya-box" id="campanya-container">
                <h2>CAMPAÑA</h2>

            </div>

        </div>

        <!-- Columna Central: Cadenas -->
        <div class="box cadenas-box">
            <h2>CADENAS</h2>
            <div class="checkbox-grid" id="cadenas-grid">
                <!-- Se cargará dinámicamente -->
            </div>

            <div class="cadenas-actions">
                <button id="btn-anyadir">Añadir cadena</button>
                <button id="btn-eliminar">Eliminar cadena</button>
                <button id="btn-modificar">Modificar cadena</button>
                <button id="btn-guardar">Guardar cambios</button>
            </div>
        </div>

        <!-- Columna Derecha: Imagen y Acciones Principales -->
        <div class="right-column">
            <div class="character-container">
                <!-- Placeholder for the character image from the reference -->
                <img src="/src/assets/images/LOGO_BANCOSOL.png" alt="Imagen Representativa" class="opacity-05 grayscale">
            </div>
            
            <div class="actions-frame">
                <div class="main-actions">
                    <button id="btn-generar">Generar campaña</button>
                    <button id="btn-historico">Ver histórico</button>
                    <button id="btn-volver-menu" class="btn-volver-menu">Menú Principal</button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL FLOTANTE PARA CRUD -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content">
            <!-- El contenido del modal se generará dinámicamente con JavaScript -->
        </div>
    </div>
    

    <footer>
        <script src="../../../components/footer/footer_comun.js" defer></script>
    </footer>
</body>
</html>
