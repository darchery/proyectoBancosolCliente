<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tiendas - Bancosol</title>
    <link rel="stylesheet" href="../../../assets/css/style_gestion.css">
    <script src="gestion_tiendas.js" defer></script>
</head>

<body>
    <header class="main-header">
        <div class="logo-area">
            <img src="/src/assets/images/LOGO_BANCOSOL_FOOTER.png" alt="Bancosol Logo">
            <div>
                <h1>GESTIÓN DE TIENDAS</h1>
            </div>
        </div>
    </header>

    <main class="dashboard">

        <!-- ── FILTROS ── -->
        <section class="filters">
            <div class="filter-group">
                <label>CADENA</label>
                <select id="filtro-cadena">
                    <option value="Todas">Todas</option>
                </select>

                <label>LOCALIDAD</label>
                <select id="filtro-localidad">
                    <option value="Todas">Todas</option>
                </select>
            </div>
            <div class="filter-group">
                <label>ZONA GEOGRÁFICA</label>
                <select id="filtro-zona">
                    <option value="Todas">Todas</option>
                </select>

                <label>COORDINADOR</label>
                <select id="filtro-coordinador">
                    <option value="Todas">Todas</option>
                </select>
            </div>
        </section>

        <div class="content-layout">

            <!-- ── TABLA ── -->
            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>TIENDA</th>
                            <th>CADENA</th>
                            <th>DOMICILIO</th>
                            <th>LOCALIDAD</th>
                            <th>COORDINADOR GR</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </section>

            <!-- ── PANEL LATERAL ── -->
            <aside class="details-panel">
                <div class="panel-header" id="panel-titulo">TIENDA SELECCIONADA</div>

                <!-- Vista de detalle: visible por defecto -->
                <div id="vista-detalle">
                    <div class="detail-row"><span>ID:</span>        <strong id="det-id">---</strong></div>
                    <div class="detail-row"><span>CADENA:</span>    <strong id="det-cadena">---</strong></div>
                    <div class="detail-row"><span>DOMICILIO:</span> <strong id="det-dom">---</strong></div>
                    <div class="detail-row"><span>LOCALIDAD:</span> <strong id="det-loc">---</strong></div>
                    <div class="detail-row"><span>ZONA:</span>      <strong id="det-zona">---</strong></div>
                    <div class="detail-row"><span>COORD:</span>     <strong id="det-coord">---</strong></div>
                </div>

                <!-- Vista de formulario: oculta hasta que se pulse Añadir o Modificar -->
                <div id="vista-formulario" class="hidden">
                    <div class="detail-row"><span>ID</span>        <input type="text" id="f-id"></div>
                    <div class="detail-row"><span>NOMBRE</span>    <input type="text" id="f-nombre"></div>
                    <div class="detail-row"><span>CADENA</span>    <input type="text" id="f-cadena"></div>
                    <div class="detail-row"><span>ZONA</span>      <input type="text" id="f-zona"></div>
                    <div class="detail-row"><span>DOMICILIO</span> <input type="text" id="f-domicilio"></div>
                    <div class="detail-row"><span>LOCALIDAD</span> <input type="text" id="f-localidad"></div>
                    <div class="detail-row"><span>COORD</span>     <input type="text" id="f-coord"></div>

                    <div class="action-buttons">
                        <button id="btn-confirmar">Guardar</button>
                        <button id="btn-cancelar">Cancelar</button>
                    </div>
                </div>

                <!-- Botones de acción: solo visibles para admin -->
                <div class="action-buttons hidden" id="admin-menu">
                    <button id="btn-anadir">Añadir tienda</button>
                    <button id="btn-modificar">Modificar tienda</button>
                    <button id="btn-eliminar">Eliminar tienda</button>
                </div>

                <!-- Botón volver al menú principal -->
                <div class="action-buttons mt-10">
                    <button id="btn-volver-menu" class="btn-volver-menu">Menú Principal</button>
                </div>
            </aside>
        </div>
    </main>

    
    <footer>
        <script src="../../../components/footer/footer_comun.js" defer></script>
    </footer>
</body>
</html>
