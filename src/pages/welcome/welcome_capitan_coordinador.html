<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Capitán-Coordinador - Panel de Control</title>
  <link rel="stylesheet" href="../../assets/css/style_welcome.css">
  <script src="welcome_capitan_coordinador.js" defer></script>
</head>

<body>

  <header>
        <script src="../../components/header/header_comun.js" defer></script>
    </header>

  <main>
    <h1>Bienvenido Capitán - Coordinador</h1>
    <div class="welcome-box">
        <p class="panel-control">Seleccione qué desea gestionar:</p>
        <section>
          <button class="btn-colaboradores" id="btn-colaboradores-cap-coor">Colaboradores</button>

          <button class="btn-bandeja" id="btn-bandeja-cap-coor">Bandeja de entrada</button>
          
          <div class="logout-container">
            <button class="boton-logout">Cerrar sesión</button>
          </div>
        </section>
    </div>
  </main>

<footer>
        <script src="../../components/footer/footer_comun.js" defer></script>
    </footer>
