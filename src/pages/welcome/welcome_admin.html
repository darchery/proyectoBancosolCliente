<!DOCTYPE html>
<html lang="es-ES">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Admin</title>
    <link rel="stylesheet" href="../../assets/css/style_welcome.css">
    <script src="welcome_admin.js" defer></script>
</head>

<body>
    <header>
        <script src="../../components/header/header_comun.js" defer></script>
    </header>

    <main>
        <h1>Bienvenido, Administrador</h1>
        <div class="welcome-box">
            <p class="panel-control">Seleccione qué desea gestionar:</p>
            <section>
                <button class="btn-colaboradores" id="btn-colaboradores-admin">Colaboradores</button>
                <button class="btn-campana" id="btn-campana-admin">Campaña</button>
                <button class="btn-tienda" id="btn-tienda-admin">Tienda</button>
                <button class="btn-voluntarios" id="btn-voluntarios-admin">Voluntarios</button>
                <button class="btn-coordinadores" id="btn-coordinadores-admin">Coordinadores</button>
                <button class="btn-bandeja-entrada" id="btn-bandeja-entrada-admin">Bandeja de entrada</button>
                
                <div class="logout-container">
                    <button id="logout-btn-admin" class="boton-logout">Cerrar sesión</button>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <script src="../../components/footer/footer_comun.js" defer></script>
    </footer>
</body>

</html>
